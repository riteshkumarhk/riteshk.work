<!DOCTYPE html>
<html lang="en" data-appearance="dark" data-theme-mode="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Served from /studio/ but the shared scripts use root-relative assets (content.json, etc.) — resolve them from the site root. -->
  <base href="/" />
  <meta name="robots" content="noindex, nofollow" />
  <script>
    // Dedicated studio app page. The landing never loads here — this IS the studio's own page.
    // Flag studio mode + pin a dark theme so the shared scripts skip all landing wiring and just
    // open the gate. window.__theme is a tiny dark shim (the real one lives on the landing).
    (function () {
      try {
        window.__STUDIO_PAGE = true;
        window.__theme = window.__theme || {
          mode: function () { return "night"; },
          isLight: function () { return false; },
          set: function () {},
          apply: function () {}
        };
      } catch (e) {}
    })();
  </script>
  <title>Studio — riteshk.work</title>
  <link rel="preload" href="/fonts/inter-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/fraunces-normal-300600-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/fonts.css?v=4" />
  <!-- The 44 font-system families (Anton, Unbounded, Schibsted, Caveat…) that power the Fonts picker.
       Without this the studio's own font cards fall back to system fonts (index.html loads this too). -->
  <link rel="stylesheet" href="/css/fonts-systems.css?v=1" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/project.css?v=1.43" />
  <link rel="stylesheet" href="/css/gensection.css?v=1" />
  <link rel="stylesheet" href="/css/admin.css?v=1.68" />
  <link rel="stylesheet" href="/css/journey.css" />
  <style>
    html, body { margin: 0; background: #08080a; min-height: 100vh; }
    .studio-splash {
      position: fixed; inset: 0; display: grid; place-items: center; z-index: 0; pointer-events: none;
      color: #6f6a64; font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .74rem; letter-spacing: .16em; text-transform: uppercase;
    }
    .studio-splash a { color: #8f8a84; text-decoration: none; }
    .studio-splash a:hover { color: #ECE7E1; }
  </style>
</head>
<body class="studio-page">
  <div class="studio-splash">Opening studio&hellip; &nbsp;·&nbsp; <a href="/">Back to riteshk.work</a></div>

  <!-- render.js exposes window.RK helpers; project.js adds the icon set (RK.iconSvg/iconNames/registerIcons)
       and gensection.js the RKGen section interpreter — both are used by the studio's icon picker + AI
       section generator. admin.js opens the gate, then lazily injects admin-studio.js. No landing / main.js. -->
  <script src="/js/render.js"></script>
  <script src="/js/project.js?v=1.45"></script>
  <script src="/js/gensection.js?v=4"></script>
  <script src="/js/admin.js?v=1.8"></script>
</body>
</html>
