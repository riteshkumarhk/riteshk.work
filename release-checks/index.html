:calc(100% - 22px)}.case-name{font-size:15px;font-weight:500;overflow-wrap:anywhere}.case-id{display:inline-block;margin-right:10px;font:10px var(--mono);color:var(--text-dim)}.case-meta{display:flex;gap:16px;align-items:center;font-size:11px}.when{color:var(--text-dim)}.status{white-space:nowrap;color:var(--text-dim)}.status[data-status=passed]{color:var(--passed)}.status[data-status=issue]{color:var(--issue)}.status[data-status=blocked]{color:var(--blocked)}.case-body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,1fr);gap:32px;padding:0 0 24px 14px}.case-body h3{font:500 12px/1.4 var(--sans);margin:0 0 10px;color:var(--text-dim)}.steps{padding-left:20px;margin:0 0 22px}.steps li{padding-left:4px;margin-bottom:8px}.expected{margin:0;line-height:1.6}.caution{color:var(--accent);font-size:12px;margin:14px 0 0}.case-link{display:inline-block;margin-top:14px;font-size:12px}.result-fields label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}.result-fields select{width:100%;margin-bottom:14px}.result-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.saved-at{font-size:11px;color:var(--text-dim)}.history{border-top:1px solid var(--line-soft);margin-top:16px;padding-top:12px;font-size:12px}.history summary{color:var(--text-dim);cursor:pointer}.history ol{padding:0 0 0 18px;margin-bottom:0}.history li{margin-top:12px}.history time{color:var(--text-dim);display:block;font-size:10px}.history p{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0}.recheck{color:var(--accent);font-size:12px;margin:0 0 14px}.conflict{border-left:2px solid var(--issue);padding-left:12px;margin:12px 0;font-size:12px}.conflict p{white-space:pre-wrap;overflow-wrap:anywhere}.conflict .actions{margin-top:10px}.empty{padding:30px 0;color:var(--text-dim)}footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);color:var(--text-dim);font-size:11px}.sr-only{position:absolute;width:1px;height:1px;overfl <body>
  <main id="signin">
    <header class="masthead"><span class="brand">riteshk.work</span><span class="private">PRIVATE VALIDATION LOG</span></header>
    <div class="heading"><h1>Release Checks</h1></div>
    <div class="actions"><button class="btn primary" id="signin-button" type="button">Sign in with passkey</button><button class="btn" id="signin-cancel" type="button" hidden>Cancel</button></div>
    <p id="signin-status" role="status" aria-live="polite">Owner access</p>
  </main>
  <main id="checklist" hidden>
    <header class="masthead">
      <div><span class="brand">riteshk.work</span><span class="private">PRIVATE VALIDATION LOG</span></div>
      <div class="actions"><button class="btn" id="refresh" type="button">Refresh checks</button><button class="btn" id="lock" type="button">Lock checklist</button><a class="btn" href="https://riteshk.work/studio/" target="_blank" rel="noopener noreferrer">Open live Studio</a></div>
    </header>
    <div class="heading"><div><h1>Release Checks</h1><p class="environment" id="environment"></p></div><div class="save-state" id="save-state" role="status" aria-live="polite">Opening private checklist...</div></div>
    <p class="safety" id="safety"></p>
    <div class="metrics" id="metrics" aria-label="Saved and pending results"></div>
    <progress id="progress" value="0" max="15" aria-label="Checks with a recorded outcome"></progress>
    <div class="filters"><nav class="tabs" id="tabs" aria-label="Filter by result"></nav><div class="filter-fields"><input type="text" id="search" aria-label="Find a check" placeholder="Find a check..."><select id="timing" aria-label="Filter by timing"><option value="all">All timings</option><option value="now">Now</option><option value="later">Next planned use</option><option value="optional">Optional</option></select></div></div>
    <div id="problem" role="alert" hidden><p id="problem-text"></p><button class="btn" id="retry" type="button">Retry saving</button></div>
    <div id="releases"><p class="empty">Opening checklist...</p></div>
    <footer id="footer">Private cloud storage</footer>
  </main>
  <script type="module">
    import { ADMIN_WORKER, webauthnAuth, webauthnSupported } from "../src/js/admin-core.js?v=1.1";
    const labels = { pending: "Not checked", passed: "Passed", issue: "Issue found", blocked: "Blocked", "not-applicable": "Not applicable" };
    const filterLabels = { all: "All", pending: "To check", passed: "Passed", issue: "Issues", blocked: "Blocked", "not-applicable": "N/A" };
    const storageKey = "rk:release-checks:cloud-pending:v1";
    const drafts = new Map(), pending = new Set(), conflicts = new Set();
    let snapshot, selected = "all", busy = false, paused = false, message = "", debounce;
    const byId = identifier => document.getElementById(identifier);
    let access, signing, expiry, generation = 0, requests = new AbortController();
    function lock(message = "Checklist locked. Sign in with your passkey.") {
      generation++; access = null; clearTimeout(expiry); requests.abort(); signing?.abort();
      snapshot = null; paused = true;
      byId("checklist").hidden = true; byId("signin").hidden = false;
      byId("releases").replaceChildren(); byId("metrics").replaceChildren();
      byId("environment").textContent = ""; byId("safety").textContent = "";
      byId("signin-status").textContent = message;
      byId("signin-button").focus();
    }
    async function apiFetch(path, init = {}) {
      if (!access || access.exp <= Date.now()) { lock("Session expired. Sign in again; pending notes are retained."); throw new Error("Passkey sign-in required."); }
      const started = generation;
      const response = await fetch(ADMIN_WORKER + "/admin/release-checks" + path, { ...init, cache: "no-store", credentials: "omit", headers: { ...init.headers, Authorization: "Bearer " + access.checklistToken }, signal: AbortSignal.any([requests.signal, init.signal || AbortSignal.timeout(10000)]) });
      const bytes = await response.arrayBuffer();
      if (started !== generation) throw new DOMException("Checklist locked.", "AbortError");
      if (response.status === 401 || response.status === 403) { lock("Session ended. Sign in again; pending notes are retained."); throw new Error("Passkey sign-in required."); }
      return new Response(bytes, { status: response.status, headers: response.headers });
    }
    byId("signin-button").addEventListener("click", async () => {
      if (signing) return;
      if (!webauthnSupported() || window.top !== window.self) { byId("signin-status").textContent = "Open this page directly in a browser with passkey support."; return; }
      const attempt = new AbortController(); signing = attempt;
      byId("signin-button").disabled = true; byId("signin-cancel").hidden = false;
      byId("signin-status").textContent = "Waiting for your passkey...";
      try {
        const result = await webauthnAuth("release-checks", { signal: attempt.signal });
        attempt.signal.throwIfAborted();
        if (!result.checklistToken || !Number.isFinite(result.exp) || result.exp <= Date.now()) throw new Error("Passkey verification did not return checklist access.");
        generation++; access = result; requests = new AbortController(); paused = false;
        expiry = setTimeout(() => lock("Session expired. Sign in again; pending notes are retained."), Math.min(result.exp - Date.now(), 3600000));
        byId("signin").hidden = true; byId("checklist").hidden = false;
        await refresh(true);
        if (access) byId("refresh").focus();
      } catch (error) { byId("signin-status").textContent = error.name === "AbortError" ? "Sign-in cancelled." : error.message; }
      finally { if (signing === attempt) signing = null; byId("signin-button").disabled = false; byId("signin-cancel").hidden = true; }
    });
    byId("signin-cancel").addEventListener("click", () => signing?.abort());
    byId("lock").addEventListener("click", () => lock());
    addEventListener("pagehide", () => lock());
    const element = (tag, className = "", text = "") => { const node = document.createElement(tag); node.className = className; node.textContent = text; return node; };
    const date = value => new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }).format(new Date(value));
    const checks = () => snapshot?.document.releases.flatMap(release => release.checks) || [];
    const same = (first, second) => JSON.stringify(first) === JSON.stringify(second);
    const saved = check => snapshot.results.checks[check.id];
    const resultVersion = record => JSON.stringify(record ? [record.status, record.notes, record.at, record.definitionVersion] : null);
    const current = check => {
      const result = drafts.get(check.id) || saved(check);
      return { status: result?.definitionVersion === check.definitionVersion ? result.status : "pending", notes: result?.notes || "", definitionVersion: check.definitionVersion };
    };
    try {
      const restored = JSON.parse(sessionStorage.getItem(storageKey) || "[]");
      if (Array.isArray(restored)) for (const [identifier, result] of restored) if (/^[A-Z0-9-]+$/.test(identifier) && Object.hasOwn(labels, result?.status) && typeof result.notes === "string") drafts.set(identifier, result);
    } catch {}

    function cacheDrafts() {
      try { if (drafts.size) sessionStorage.setItem(storageKey, JSON.stringify([...drafts])); else sessionStorage.removeItem(storageKey); }
      catch { message = "Pending changes cannot be retained in this browser. Keep this tab open until the result is saved."; }
    }
    function saveState() {
      const node = byId("save-state");
      document.documentElement.dataset.pending = String(drafts.size);
      node.dataset.error = String(paused || conflicts.size > 0);
      const times = Object.values(snapshot?.results.checks || {}).map(result => result.at).sort();
      node.textContent = busy ? "Saving..." : conflicts.size ? "Conflicting result: review required" : drafts.size ? drafts.size + " unsaved change" + (drafts.size === 1 ? "" : "s") : times.length ? "Saved / " + date(times.at(-1)) : "No manual results recorded";
      byId("problem").hidden = !message;
      byId("problem-text").textContent = message;
      byId("retry").hidden = conflicts.size > 0;
    }
    function edit(check, patch, immediate = false) {
      drafts.set(check.id, { ...current(check), ...patch, definitionVersion: check.definitionVersion, baseResult: drafts.get(check.id)?.baseResult ?? resultVersion(saved(check)) });
      cacheDrafts();
      pending.add(check.id);
      saveState();
      clearTimeout(debounce);
      if (immediate) { render(); void flush(); }
      else debounce = setTimeout(flush, 600);
    }
    async function flush() {
      if (busy || paused) return;
      const identifier = [...pending].find(item => !conflicts.has(item));
      if (!identifier) return;
      pending.delete(identifier);
      const attempt = drafts.get(identifier);
      if (!attempt) return;
      const previous = snapshot.results.checks[identifier];
      busy = true; saveState();
      try {
        const response = await apiFetch("/results/" + identifier, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...attempt, revision: snapshot.results.revision }), signal: AbortSignal.timeout(10000) });
        const result = await response.json();
        if (response.status === 409 && result.current) {
          snapshot = result.current;
          const check = checks().find(item => item.id === identifier);
          if (same(previous, snapshot.results.checks[identifier]) && attempt.definitionVersion === check?.definitionVersion) pending.add(identifier);
          else { conflicts.add(identifier); message = "A saved result or its test steps changed. Your pending result is kept below for review."; }
        } else {
          if (!response.ok) throw new Error(result.error || "Save was not confirmed.");
          snapshot = result;
          if (same(drafts.get(identifier), attempt)) drafts.delete(identifier);
          else { drafts.set(identifier, { ...drafts.get(identifier), baseResult: resultVersion(snapshot.results.checks[identifier]) }); pending.add(identifier); }
          message = "";
        }
      } catch (error) {
        paused = true; pending.add(identifier);
        message = "Save not confirmed. Your pending changes remain in this tab. " + (error.name === "TimeoutError" ? "The server did not respond." : error.message);
      } finally {
        busy = false; cacheDrafts(); render();
        if (!paused) void flush();
      }
    }
    async function refresh(manual = false) {
      if (!access) return;
      if (busy) return;
      if (drafts.size && !manual) return;
      try {
        const response = await apiFetch("", { signal: AbortSignal.timeout(10000) });
        const latest = await response.json();
        if (!response.ok) throw new Error(latest.error || "Could not open the private checklist.");
        const recovered = !snapshot && drafts.size > 0;
        for (const [identifier, draft] of drafts) {
          const check = latest.document.releases.flatMap(release => release.checks).find(item => item.id === identifier);
          if (draft.baseResult !== resultVersion(latest.results.checks[identifier]) || draft.definitionVersion !== check?.definitionVersion) conflicts.add(identifier);
        }
        if (!snapshot || !drafts.size) snapshot = latest;
        else {
          for (const [identifier, draft] of drafts) {
            const check = latest.document.releases.flatMap(release => release.checks).find(item => item.id === identifier);
            if (!same(snapshot.results.checks[identifier], latest.results.checks[identifier]) || draft.definitionVersion !== check?.definitionVersion) conflicts.add(identifier);
          }
          snapshot = latest;
        }
        message = conflicts.size ? "A saved result or its test steps changed. Review the pending result below." : "";
        if (recovered && !conflicts.size) { paused = true; message = "Recovered unsaved results from this tab. Review them, then retry saving."; }
        render();
      } catch (error) {
        message = "The private checklist server is unavailable. Existing results have not been cleared. " + error.message;
        saveState();
      }
    }
    function renderCase(check, open, historyOpen, evidence) {
      const result = current(check), record = saved(check);
      const article = element("article", "case"); article.dataset.id = check.id; article.id = check.id;
      const label = element("label", "pass-control"); label.title = "Mark " + check.id + " passed";
      const checkbox = element("input"); checkbox.type = "checkbox"; checkbox.checked = result.status === "passed"; checkbox.dataset.field = "passed"; checkbox.setAttribute("aria-label", "Mark " + check.id + " passed");
      checkbox.addEventListener("change", () => edit(check, { status: checkbox.checked ? "passed" : "pending" }, true)); label.append(checkbox);
      const details = element("details", "case-details"); details.open = open || conflicts.has(check.id);
      const summary = element("summary");
      const line = element("span", "summary-line"), name = element("span", "case-name"); name.append(element("span", "case-id", check.id), document.createTextNode(check.title));
      const automated = element("span", "playwright-status", "Playwright approved: " + (evidence?.approved === true ? "Yes" : "No"));
      automated.dataset.approved = String(evidence?.approved === true); name.append(automated);
      const meta = element("span", "case-meta"), status = element("span", "status", labels[result.status]); status.dataset.status = result.status;
      meta.append(element("span", "when", check.when), status); line.append(name, meta); summary.append(line);
      const body = element("div", "case-body"), instructions = element("div"), fields = element("div", "result-fields");
      instructions.append(element("h3", "", check.area + " / Steps"));
      const steps = element("ol", "steps"); for (const step of check.steps) steps.append(element("li", "", step));
      instructions.append(steps, element("h3", "", "Expected"), element("p", "expected", check.expected));
      instructions.append(element("h3", "", "Playwright evidence"), element("p", "playwright-evidence", evidence ? [evidence.at, evidence.test, evidence.scope].filter(Boolean).join(" / ") : "No case-specific Playwright approval recorded. This is not a failed manual result."));
      if (check.caution) instructions.append(element("p", "caution", check.caution));
      if (check.url) {
        const destination = new URL(check.url);
        if (destination.protocol === "https:" && destination.hostname === "riteshk.work") { const link = element("a", "case-link", "Open live page"); link.href = destination.href; link.target = "_blank"; link.rel = "noopener noreferrer"; instructions.append(link); }
      }
      if (record && record.definitionVersion !== check.definitionVersion) fields.append(element("p", "recheck", "Steps changed since your last result. Recheck required; previous results are kept in history."));
      const resultLabel = element("label", "", "Result"); resultLabel.htmlFor = check.id + "-result";
      const select = element("select"); select.id = resultLabel.htmlFor; select.dataset.field = "result";
      for (const [value, text] of Object.entries(labels)) { const option = element("option", "", text); option.value = value; select.append(option); }
      select.value = result.status; select.addEventListener("change", () => edit(check, { status: select.value }, true));
      const notesLabel = element("label", "", "Observed result / notes"); notesLabel.htmlFor = check.id + "-notes";
      const notes = element("textarea"); notes.id = notesLabel.htmlFor; notes.dataset.field = "notes"; notes.maxLength = 4000; notes.value = result.notes; notes.rows = 3;
      notes.addEventListener("input", () => edit(check, { notes: notes.value }));
      const actions = element("div", "result-actions"), save = element("button", "btn", "Save notes"); save.type = "button"; save.dataset.field = "save";
      save.addEventListener("click", () => { paused = false; edit(check, { notes: notes.value }, true); });
      actions.append(element("span", "saved-at", drafts.has(check.id) ? "Pending save" : record ? "Saved " + date(record.at) : "Not checked yet"), save);
      fields.append(resultLabel, select, notesLabel, notes, actions);
      if (conflicts.has(check.id)) {
        const conflict = element("div", "conflict"); conflict.setAttribute("role", "alert");
        conflict.append(element("strong", "", "Saved result changed"), element("p", "", record ? labels[record.status] + " / " + date(record.at) + "\n" + record.notes : "The test steps have changed. Review them before confirming your result."));
        const buttons = element("div", "actions"), mine = element("button", "btn", "Keep my result"), theirs = element("button", "btn", "Use saved result"); mine.type = theirs.type = "button";
        mine.addEventListener("click", () => { conflicts.delete(check.id); paused = false; drafts.set(check.id, { ...drafts.get(check.id), baseResult: resultVersion(record) }); edit(check, { status: select.value, notes: notes.value }, true); });
        theirs.addEventListener("click", () => { conflicts.delete(check.id); drafts.delete(check.id); pending.delete(check.id); if (!conflicts.size) message = ""; cacheDrafts(); render(); });
        buttons.append(mine, theirs); conflict.append(buttons); fields.append(conflict);
      }
      const history = element("details", "history"), historyTitle = element("summary", "", "Result history (" + (record?.history.length || 0) + ")"); history.append(historyTitle);
      history.open = historyOpen;
      const events = element("ol");
      for (const event of [...(record?.history || [])].reverse()) { const item = element("li"), time = element("time", "", date(event.at)); time.dateTime = event.at; item.append(element("span", "", labels[event.status]), time); if (event.notes) item.append(element("p", "", event.notes)); events.append(item); }
      if (!record?.history.length) history.append(element("p", "", "No manual result recorded.")); else history.append(events);
      fields.append(history); body.append(instructions, fields); details.append(summary, body); article.append(label, details); return article;
    }
    function render() {
      if (!snapshot) { saveState(); return; }
      const open = new Set([...document.querySelectorAll(".case-details[open]")].map(node => node.closest(".case").dataset.id));
      const historyOpen = new Set([...document.querySelectorAll(".history[open]")].map(node => node.closest(".case").dataset.id));
      const evidenceOpen = new Set([...document.querySelectorAll(".evidence[open]")].map(node => node.closest(".release").dataset.release));
      const focus = document.activeElement, focusCase = focus?.closest(".case")?.dataset.id, focusField = focus?.dataset.field, selection = [focus?.selectionStart, focus?.selectionEnd];
      byId("environment").textContent = snapshot.document.environment + " / Live site";
      byId("safety").textContent = snapshot.document.safety;
      const counts = Object.fromEntries(Object.keys(labels).map(status => [status, 0]));
      for (const check of checks()) counts[current(check).status]++;
      byId("metrics").replaceChildren(...Object.entries(counts).map(([status, count]) => { const metric = element("div", "metric"); metric.dataset.status = status; metric.append(element("strong", "", String(count)), element("span", "", filterLabels[status])); return metric; }));
      byId("progress").max = checks().length; byId("progress").value = counts.passed + counts.issue + counts["not-applicable"];
      byId("tabs").replaceChildren(...Object.entries(filterLabels).map(([status, text]) => { const button = element("button", "tab", text + " " + (status === "all" ? checks().length : counts[status])); button.type = "button"; button.setAttribute("aria-pressed", String(status === selected)); button.addEventListener("click", () => { selected = status; render(); byId("tabs").querySelector('[aria-pressed="true"]').focus(); }); return button; }));
      const search = byId("search").value.toLowerCase().trim(), timing = byId("timing").value;
      const sections = []; let visible = 0;
      for (const release of snapshot.document.releases) {
        const filtered = release.checks.filter(check => (selected === "all" || current(check).status === selected) && (timing === "all" || (timing === "now" ? check.when === "Now" : timing === "optional" ? check.when === "Optional" : check.when.startsWith("Next"))) && (!search || (check.id + " " + check.title + " " + check.area + " " + check.steps.join(" ") + " " + current(check).notes).toLowerCase().includes(search)));
        if (!filtered.length) continue;
        const section = element("section", "release"), heading = element("div", "release-title");
        section.dataset.release = release.id;
        heading.append(element("h2", "", release.title), element("span", "release-meta", release.date + " / " + release.version));
        const evidence = element("details", "evidence"); evidence.append(element("summary", "", "Automated verification"), element("p", "", release.automatedEvidence));
        evidence.open = evidenceOpen.has(release.id);
        section.append(heading, evidence); for (const check of filtered) section.append(renderCase(check, open.has(check.id), historyOpen.has(check.id), release.playwright?.[check.id])); sections.push(section); visible += filtered.length;
      }
      byId("releases").replaceChildren(...(visible ? sections : [element("p", "empty", "No checks match these filters.")]));
      byId("footer").textContent = visible + " of " + checks().length + " checks / Private cloud storage";
      saveState();
      if (focusCase && focusField) { const target = document.querySelector('[data-id="' + focusCase + '"] [data-field="' + focusField + '"]'); if (target) { target.focus({ preventScroll: true }); if (typeof selection[0] === "number") target.setSelectionRange?.(...selection); } }
    }
    byId("search").addEventListener("input", render);
    byId("timing").addEventListener("change", render);
    byId("refresh").addEventListener("click", () => refresh(true));
    byId("retry").addEventListener("click", () => { paused = false; message = ""; if (!snapshot) void refresh(true); else { for (const identifier of drafts.keys()) pending.add(identifier); void flush(); } });
    addEventListener("beforeunload", event => { if (drafts.size) { event.preventDefault(); event.returnValue = ""; } });
    addEventListener("focus", () => refresh());
    setInterval(() => { if (document.visibilityState === "visible") void refresh(); }, 30000);
  </script>
</body>
