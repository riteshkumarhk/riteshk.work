name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run root regressions sequentially
        run: |
          mapfile -t tests < <(find . -maxdepth 1 -type f \( -name '*.test.mjs' -o -name '*.test.cjs' \) ! -name '*.browser.test.mjs' ! -name 'slide-studio-deck.test.mjs' ! -name 'ai-ribbon.test.mjs' | sort)
          node --test --test-concurrency=1 "${tests[@]}"

      - name: Rebuild bundles
        run: npm run build

      - name: Rebuild slide bundles
        run: npm run build:slide-lab

      - name: Fail if committed bundles are out of date
        run: |
          if [ -n "$(git status --porcelain js/ studio/slide-lab/assets/)" ]; then
            echo "::error::Committed output is stale. Run both build commands locally and commit the result."
            git --no-pager diff --stat -- js/ studio/slide-lab/assets/
            exit 1
          fi

      - name: Syntax-check every bundle
        run: |
          for f in js/*.js; do
            node --check "$f" || { echo "::error::Syntax check failed for $f"; exit 1; }
          done
          echo "OK — all bundles pass node --check."

      - name: Prepare tested site artifact
        run: |
          mkdir "$RUNNER_TEMP/site"
          git archive --format=tar HEAD > "$RUNNER_TEMP/tested-source.tar"
          tar -xf "$RUNNER_TEMP/tested-source.tar" -C "$RUNNER_TEMP/site"

      - uses: actions/upload-artifact@v4
        with:
          name: tested-source
          path: ${{ runner.temp }}/tested-source.tar
          retention-days: 1

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site

  browser-checks:
    needs: verify-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [authoring, sections, recovery]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-source

      - name: Extract verified source and bundles
        run: tar -xf tested-source.tar

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install test browser
        run: npx playwright-core install --with-deps chromium

      - name: Run required browser shard
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
        run: |
          python3 -m http.server 5510 --bind 127.0.0.1 > "$RUNNER_TEMP/site-test.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export SLIDE_LAB_URL=http://127.0.0.1:5510
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node -p "require('playwright-core').chromium.executablePath()")"
          curl --silent --show-error --fail --retry 5 --retry-delay 1 --retry-connrefused --max-time 2 "$SLIDE_LAB_URL/index.html" > /dev/null
          node tools/browser-shards.mjs "$BROWSER_SHARD"

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify-build, browser-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
