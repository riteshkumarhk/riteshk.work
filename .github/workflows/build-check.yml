name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run root regressions sequentially
        run: npm run test:root

      - name: Rebuild bundles
        run: npm run build

      - name: Rebuild slide bundles
        run: npm run build:slide-lab

      - name: Rebuild resume bundles
        run: npm run build:resume

      - name: Fail if committed bundles are out of date
        run: |
          if [ -n "$(git status --porcelain js/ studio/slide-lab/assets/ studio/resume-preview/assets/)" ]; then
            echo "::error::Committed output is stale. Run both build commands locally and commit the result."
            git --no-pager diff --stat -- js/ studio/slide-lab/assets/ studio/resume-preview/assets/
            exit 1
          fi

      - name: Syntax-check every bundle
        run: |
          for f in js/*.js; do
            node --check "$f" || { echo "::error::Syntax check failed for $f"; exit 1; }
          done
          echo "OK — all bundles pass node --check."

      - name: Prepare tested site artifact
        run: |
          mkdir "$RUNNER_TEMP/site"
          git archive --format=tar HEAD > "$RUNNER_TEMP/tested-source.tar"
          tar -xf "$RUNNER_TEMP/tested-source.tar" -C "$RUNNER_TEMP/site"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-source
          path: ${{ runner.temp }}/tested-source.tar
          retention-days: 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site

  browser-checks:
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [authoring, sections, resume-workspace, journey, recovery, presenters]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-source

      - name: Extract verified source and bundles
        run: tar -xf tested-source.tar

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install test browser
        run: npx playwright-core install --with-deps chromium

      - name: Run required browser shard
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_SHARD_REPORT: browser-timings-${{ matrix.shard }}.json
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 -u serve.py > "$RUNNER_TEMP/site-test.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export SLIDE_LAB_URL=http://127.0.0.1:5510
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node -p "require('playwright-core').chromium.executablePath()")"
          curl --silent --show-error --fail --retry 5 --retry-delay 1 --retry-connrefused --max-time 2 "$SLIDE_LAB_URL/index.html" > /dev/null
          node tools/browser-shards.mjs "$BROWSER_SHARD"

      - name: Preserve browser task timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-timings-${{ matrix.shard }}-${{ github.run_attempt }}
          path: browser-timings-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rk-*.png
            ${{ runner.temp }}/site-test.log
          if-no-files-found: ignore
          retention-days: 7

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify-build, browser-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1