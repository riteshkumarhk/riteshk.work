name: build-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run root regressions sequentially
        run: npm run test:root

      - name: Rebuild bundles
        run: npm run build

      - name: Rebuild slide bundles
        run: npm run build:slide-lab

      - name: Rebuild resume bundles
        run: npm run build:resume

      - name: Fail if committed bundles are out of date
        run: |
          if [ -n "$(git status --porcelain js/ studio/slide-lab/assets/ studio/resume-preview/assets/)" ]; then
            echo "::error::Committed output is stale. Run both build commands locally and commit the result."
            git --no-pager diff --stat -- js/ studio/slide-lab/assets/ studio/resume-preview/assets/
            exit 1
          fi

      - name: Syntax-check every bundle
        run: |
          for f in js/*.js; do
            node --check "$f" || { echo "::error::Syntax check failed for $f"; exit 1; }
          done
          echo "OK — all bundles pass node --check."

      - name: Prepare tested site artifact
        run: |
          mkdir "$RUNNER_TEMP/site"
          git archive --format=tar HEAD > "$RUNNER_TEMP/tested-source.tar"
          tar -xf "$RUNNER_TEMP/tested-source.tar" -C "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site

  # Browser shards test the same commit in parallel with verify-build; Pages
  # deploys only after verify-build and every shard succeed for that commit.
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [prepare, authoring, sections, resume-workspace, resume-editor, resume-review, resume-probe, resume-cli, journey, recovery, presenters]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install test browser
        run: |
          # Abandon stalled Ubuntu mirror downloads quickly instead of waiting minutes.
          printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network > /dev/null
          npx playwright-core install --with-deps chromium

      - name: Run required browser shard
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_SHARD_REPORT: browser-timings-${{ matrix.shard }}.json
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 -u serve.py > "$RUNNER_TEMP/site-test.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          export SLIDE_LAB_URL=http://127.0.0.1:5510
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node -p "require('playwright-core').chromium.executablePath()")"
          curl --silent --show-error --fail --retry 5 --retry-delay 1 --retry-connrefused --max-time 2 "$SLIDE_LAB_URL/index.html" > /dev/null
          node tools/browser-shards.mjs "$BROWSER_SHARD"

      - name: Preserve browser task timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-timings-${{ matrix.shard }}-${{ github.run_attempt }}
          path: browser-timings-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rk-*.png
            ${{ runner.temp }}/site-test.log
          if-no-files-found: ignore
          retention-days: 7

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify-build, browser-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5