<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Requests — riteshk</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#08080a">
  <link rel="manifest" href="/inbox/manifest.webmanifest">
  <link rel="icon" href="/inbox/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/inbox/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Requests">
  <style>
    :root{
      --bg:#08080a; --bg2:#0d0d10; --card:#111116; --line:#23232a;
      --text:#ECE7E1; --dim:#8f8a84; --faint:#5a5650; --accent:#D8A657; --warn:#c9704f; --err:#d9534f;
      --serif:"Fraunces",Georgia,"Times New Roman",serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100dvh}
    #app{min-height:100dvh;display:flex;flex-direction:column;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .wrap{max-width:560px;margin:0 auto;width:100%;padding:24px 18px 44px;flex:1}
    .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:0}
    .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .iconbtn{background:var(--bg2);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:20px}
    h1{font-family:var(--serif);font-size:26px;margin:0 0 10px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
    p{line-height:1.5;margin:0 0 16px}
    .muted{color:var(--dim)} .small{font-size:13px}
    .btn{display:block;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;text-align:center}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#0a0a0a}
    .btn.warn{color:var(--warn);border-color:#3a2a24;background:transparent}
    .btn.ghost{background:transparent}
    .btn:disabled{opacity:.55}
    .step{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
    .step__n{width:26px;height:26px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:13px;font-weight:700;flex:none}
    .step__b{flex:1}.step__t{font-weight:600;margin-bottom:3px}
    .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .list{display:flex;flex-direction:column;gap:12px;margin-top:18px}
    .req{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;transition:opacity .3s}
    .req.done{opacity:.5}
    .req__top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .req__name{font-weight:650}.req__co{color:var(--dim)}
    .req__time{color:var(--faint);font-size:12px;flex:none;white-space:nowrap}
    .req__email{display:block;color:var(--accent);text-decoration:none;font-size:14px;margin-top:2px;word-break:break-all}
    .req__meta{color:var(--dim);font-size:13px;margin-top:6px}
    .req__note{color:var(--text);font-size:14px;margin-top:6px;font-style:italic;opacity:.9}
    .req__acts{display:flex;gap:8px;margin-top:14px}
    .req__acts .btn{flex:1;width:auto;margin-top:0;padding:11px 6px;font-size:13px}
    .req__done{margin-top:14px;color:var(--accent);font-weight:600;font-size:14px}
    .empty{text-align:center;padding:48px 0}
    .note{margin-top:10px;font-size:13px;color:var(--dim)}.note.err{color:var(--err)}
    .topbar__acts{display:flex;gap:8px}
    .help{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
    .help summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none;outline:none}
    .help summary::-webkit-details-marker{display:none}
    .help summary::after{content:" ›";color:var(--faint)}
    .help[open] summary::after{content:" ⌄"}
    .help > div{margin-top:10px;line-height:1.55}
    .help b{color:var(--text);font-weight:600}
    .tabs{display:flex;gap:6px;margin:16px 0 4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
    .tab{flex:1;padding:9px 6px;border:0;border-radius:9px;background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
    .tab--on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
    .tabbody{display:flex;flex-direction:column;gap:12px;margin-top:14px}
    .switch{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:13px;cursor:pointer;padding:2px 2px 6px}
    .switch input{width:18px;height:18px;accent-color:var(--accent)}
    .req--off{opacity:.5}
    .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:50;pointer-events:none}
    .toast--in{opacity:1;transform:translate(-50%,0)}
    .nudge{display:flex;align-items:center;gap:12px;margin:12px 0 2px;padding:12px 14px;border:1px solid var(--accent);border-radius:12px;background:rgba(216,166,87,.08)}
    .nudge__txt{flex:1;font-size:13px;line-height:1.4;color:var(--text)}
    .nudge__btn{flex:none;padding:9px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#0a0a0a;font-size:14px;font-weight:600;cursor:pointer}
    .nudge__btn:disabled{opacity:.6}
    .rel{display:flex;flex-direction:column;gap:12px;margin-top:2px}
    .rel > .muted{margin-bottom:2px}
    .rel__row{display:flex;gap:11px;align-items:flex-start;cursor:pointer}
    .rel__row input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}
    .rel__b{flex:1}
    .rel__t{font-size:14px;font-weight:600;line-height:1.35}
    .rel__t b{color:var(--accent);font-weight:700}
    .rel__d{margin-top:1px}
    .rel__p{font-size:11px;color:var(--faint);margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .rel__row--done .rel__t{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint)}
    .curgrp{border:1px solid var(--line);border-radius:12px;margin-top:12px;background:var(--bg2);overflow:hidden}
    .curgrp summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;outline:none}
    .curgrp summary::-webkit-details-marker{display:none}
    .curgrp summary::after{content:"\203a";color:var(--faint);font-size:18px;transform:rotate(90deg);transition:transform .2s;margin-left:4px}
    .curgrp[open] summary::after{transform:rotate(-90deg)}
    .curgrp__hint{color:var(--faint);font-size:12px;font-weight:400;margin-left:auto}
    .curgrp__grid{display:flex;flex-direction:column;gap:1px;padding:2px 8px 10px;max-height:44vh;overflow-y:auto}
    .curchk{display:flex;gap:11px;align-items:flex-start;padding:9px 7px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.35}
    .curchk:active{background:var(--card)}
    .curchk input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}
    .curdays{margin:16px 0 2px;color:var(--dim);font-size:14px}
    .curdays label{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .curdays__in{width:66px;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:15px;font-family:inherit}
    .tab{white-space:nowrap}
    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .insdays{display:flex;gap:6px}
    .insday{flex:1;padding:8px 6px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
    .insday--on{background:var(--accent);border-color:var(--accent);color:#0a0a0a}
    .ins{display:flex;flex-direction:column;gap:12px}
    .inscards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .inscard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .inscard__n{font-size:24px;font-weight:700;font-family:var(--serif);letter-spacing:-.02em}
    .inscard__l{color:var(--dim);font-size:12px;margin-top:2px}
    .inspanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
    .insph{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:10px}
    .insspark{width:100%;height:64px;display:block}
    .insspark__a{fill:rgba(216,166,87,.14);stroke:none}
    .insspark__l{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
    .insbars{display:flex;flex-direction:column;gap:9px}
    .insbar{display:flex;align-items:center;gap:9px}
    .insbar__l{flex:0 0 42%;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .insbar__t{flex:1;height:7px;background:var(--bg2);border:1px solid var(--line);border-radius:100px;overflow:hidden}
    .insbar__f{display:block;height:100%;background:var(--accent);border-radius:100px}
    .insbar__n{flex:0 0 auto;min-width:34px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
    .insfeed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
    .insfeed li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
    .insfeed li:first-child{border-top:0}
    .insfeed__w{flex:0 0 auto}
    .insfeed__l{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .insfeed__l b{color:var(--text);font-weight:600}
    .insfeed__t{flex:0 0 auto;color:var(--faint);font-size:11px;white-space:nowrap}
    .insempty{color:var(--dim);font-size:13px;padding:6px 0}
    .insdig{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
    .insdig__h{font-weight:650;font-size:15px}
    .insdig__row{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
    .insdig__row input{width:20px;height:20px;accent-color:var(--accent);flex:none}
    .insdig__freq{margin-top:2px}
  </style>
</head>
<body>
  <div id="app"><div class="wrap"><div class="spinner"></div><p class="muted" style="text-align:center">Loading…</p></div></div>
  <script src="/inbox/inbox.js"></script>
</body>
</html>
