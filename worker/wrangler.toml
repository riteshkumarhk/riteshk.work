name = "rk-ai-proxy"
main = "rk-ai-proxy.js"
compatibility_date = "2026-07-28"
workers_dev = true
preview_urls = false

# Private R2 bucket for NDA media (the "vault") — objects are served only through the Worker.
[[r2_buckets]]
binding = "VAULT"
bucket_name = "rk-vault"

# Public R2 bucket for folio media (covers, videos, gifs). Served publicly (no auth) via GET /media/<key>.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rk-media"

# KV store for curated-view (ticket) grants: pass-hash -> {allowed vault keys, expiry}.
[[kv_namespaces]]
binding = "VAULT_GRANTS"
id = "ec6ed36fa1fd4dbfb9483a147d003aef"

# Headless-Chrome Browser Rendering (Workers Free tier: 10 min/day). Powers /admin/render-pdf, which
# turns the résumé print-HTML into a real, ATS-safe, WYSIWYG PDF. quickAction("pdf") is one-shot —
# CF opens Chrome, renders, returns the PDF and closes the browser itself (no session to leak).
[browser]
binding = "BROWSER"

# Plain-text var (kept in sync with the dashboard). Secrets (ACCESS_TOKEN,
# ANTHROPIC_KEY, ADMIN_HASH, ADMIN_SALT, SESSION_SECRET, GH_TOKEN, ...) are set
# via the dashboard / `wrangler secret put` and are NOT stored in this file.
[vars]
# Comma-separate to add origins. localhost entries let the studio be driven locally
# (e.g. via ?devstub) against the deployed Worker for live testing; every route still
# requires the ACCESS_TOKEN / admin session, so the extra origins grant no access on their own.
ALLOW_ORIGIN = "https://riteshk.work,http://localhost:5510,http://127.0.0.1:5510"
OWNER = "riteshkumarhk"
REPO = "riteshk.work"
# Public Cloudflare identifiers for the studio Insights readout (NOT secrets). The paired
# CF_ANALYTICS_TOKEN (Account Analytics: Read) is set via `wrangler secret put` and unlocks
# the traffic/referrers/country-map half; until then Insights shows first-party events only.
CF_ACCOUNT_ID = "6ccabe73a5dd6fb67572fec087b83bdb"
CF_SITE_TAG = "b4123aee7d8a4077bc9296922e52e803"

[observability]
enabled = true

[observability.logs]
enabled = true
